<style>
:root{--bg:#f3f4f6;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--A:#2563eb;--B:#dc2626;--acc:#0f766e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
body{overscroll-behavior:none}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
input,textarea{font:inherit}
.hidden{display:none!important}
.i{width:1.2em;height:1.2em;vertical-align:-0.22em;flex:none}
.btn,.tb,.tog,.chip,.big,.okko button,.tchip,.nopl{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.big{justify-content:flex-start}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;display:flex;align-items:center;justify-content:center}
.logo .i{width:30px;height:30px}
.sport .ic{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;display:flex!important;align-items:center;justify-content:center;background:#f1f5f9;color:#0f766e}
.sport .ic .i{width:32px;height:32px}
.sport.on .ic{background:#0f766e;color:#fff}
#top .dot{box-shadow:0 0 0 2px #9ca3af}
#top .tt{display:flex;align-items:center;gap:8px}
#top .tt .i{color:#5eead4}

/* ---------- Écran de réglage ---------- */
#setup{height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:1000px;margin:0 auto;padding:22px 28px 80px}
h1{margin:0 0 4px;font-size:30px}
.sub{margin:0 0 18px;color:var(--mut)}
h2{font-size:20px;margin:26px 0 10px}
h3{font-size:16px;margin:16px 0 8px}
.hint{color:var(--mut);font-size:14px;margin:4px 0 10px;line-height:1.4}
.sports{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sport{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center;font-size:16px;font-weight:600}
.sport .ic{font-size:38px;display:block;margin-bottom:4px}
.sport small{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:2px}
.sport.on{border-color:var(--acc);background:#ecfdf5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tcard{background:#fff;border-radius:14px;padding:12px 14px;border-left:8px solid}
.tcard label{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
.tcard input,.tcard textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:17px;background:#fff}
.tcard textarea{min-height:120px;font-size:15px;margin-top:8px}
.itrow{display:flex;gap:8px;align-items:center;background:#fff;border-radius:12px;padding:8px 10px;margin-bottom:8px;flex-wrap:wrap}
.itrow input[type=color]{width:40px;height:40px;border:none;padding:0;background:none;border-radius:8px}
.itrow .nm{flex:1;min-width:160px;border:1.5px solid var(--line);border-radius:10px;padding:9px;font-size:16px}
.itrow .lb{width:110px;border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:14px}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:15px}
.btn.prim{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.danger{color:#b91c1c}
.start{display:block;width:100%;margin-top:26px;padding:18px;font-size:20px}
.resume{background:#fff7ed;border:2px solid #fdba74;border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}

/* toggles & chips */
.tog{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:14px}
.tog.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.3)}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #d1d5db;padding:0}
.sw.on{outline:3px solid #0f766e;outline-offset:2px}
.colrow{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}
.colrow input[type=color]{width:38px;height:38px;border:none;padding:0;background:none}

/* ---------- Écran d'observation ---------- */
#obs{position:fixed;inset:0;display:flex;flex-direction:column}
#top{height:54px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;background:#111827;color:#fff;font-size:16px}
#top .tt{font-weight:700;white-space:nowrap}
#top .vs{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .tb{background:#374151;border:none;border-radius:10px;padding:9px 13px;color:#fff;font-size:15px;white-space:nowrap}
#top .tb.cam{background:#0f766e}
.tA{color:#93c5fd;font-weight:700}.tB{color:#fca5a5;font-weight:700}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;min-width:0;padding:6px;display:flex;position:relative}
#court{width:100%;height:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:block}
#panel{width:330px;flex:none;overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;border-left:1px solid var(--line);padding:10px 12px 40px}
.eleve #panel{width:270px}
#panel section{border-bottom:1px solid var(--line);padding:6px 0 12px}
#panel h3{margin:6px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.lbl{font-size:13px;color:var(--mut);margin:8px 0 5px}
.teams{display:flex;gap:6px}
.teams button{flex:1;border:3px solid rgba(0,0,0,.15);border-radius:12px;padding:10px 6px;color:#fff;font-weight:700;font-size:15px;opacity:.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teams button.on{opacity:1;border-color:#111}
.teams.auto button{opacity:.25}
.note{font-size:12.5px;color:var(--acc);background:#ecfdf5;border-radius:8px;padding:6px 8px;margin-top:6px;line-height:1.35}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.row .btn{padding:9px 10px;font-size:14px;flex:1;white-space:nowrap}
.st{font-size:14px;line-height:1.45;margin:6px 0 10px}
.st .hd{font-weight:700;display:flex;align-items:center;gap:6px}
.st .zn{background:#fef9c3;border-radius:8px;padding:5px 8px;margin-top:4px;font-size:13px}
.li{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.li span.t{flex:1}
.li button{border:none;background:#fee2e2;color:#b91c1c;border-radius:8px;padding:4px 9px}
.big{display:block;width:100%;padding:15px 10px;border-radius:14px;border:4px solid transparent;font-size:18px;font-weight:700;margin-bottom:8px;color:#fff;text-align:left}
.big.on{border-color:#111;box-shadow:0 0 0 2px #fff inset}
.big.off{opacity:.5}
.eleve .teams button{padding:16px 6px;font-size:18px}
.cnt{font-size:15px;line-height:1.5;margin:10px 0}

/* popup de saisie */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.12);z-index:10}
#popup{position:fixed;z-index:11;background:#fff;border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.32);padding:12px;width:300px}
#popup .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:16px}

#popup .pl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
#popup .pchip{border:2px solid var(--line);background:#f9fafb;border-radius:10px;padding:10px 12px;font-size:16px;font-weight:600;min-width:48px}

.okko{display:flex;gap:8px}
.okko button{flex:1;padding:18px 6px;font-size:18px;font-weight:700;border:none;border-radius:12px;color:#fff}
.okko .ok{background:#16a34a}.okko .ko{background:#dc2626}
#popup .nopl{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:15px}
#popup .pcancel{width:100%;margin-top:8px;padding:9px;border:none;background:none;color:var(--mut);font-size:14px}

/* capture */
#cap{position:fixed;inset:0;background:rgba(17,24,39,.85);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px}
#cap img{max-width:100%;max-height:72vh;border-radius:10px;background:#fff;-webkit-touch-callout:default}
#cap .row{justify-content:center}
#cap p{color:#e5e7eb;margin:0;font-size:14px;text-align:center}
.collapsed #panel{display:none}
#top .mini{flex:1;display:flex;gap:6px;overflow-x:auto;align-items:center;min-width:0}
#top .mini button{border:2px solid transparent;border-radius:999px;padding:6px 12px;font-size:14px;color:#fff;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;opacity:.55}
#top .mini button.on{opacity:1;border-color:#fff}
#top .mini .sep{width:1px;height:26px;background:#4b5563;flex:none}
.tb.end{background:#f59e0b;color:#111827;font-weight:700}
#end{position:fixed;inset:0;z-index:15;background:#e5e7eb;display:flex;flex-direction:column}
#end .endbar{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#end .endbar .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#end .endbar .lbl{margin:0 4px 0 0}
#end .endbar .acts{margin-left:auto;display:flex;gap:6px}
#end .poster{flex:1;min-height:0;padding:10px;display:flex}
#end .poster svg{width:100%;height:100%}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
.ping{transform-box:fill-box;transform-origin:center;animation:ping .7s ease-out forwards}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(2.4);opacity:0}}
.pend{transform-box:fill-box;transform-origin:center;animation:pend 1s ease-in-out infinite}
@keyframes pend{0%,100%{opacity:1}50%{opacity:.35}}
/* mode possession */
#stage{flex-direction:column;gap:6px}
#court{flex:1;min-height:0;height:auto}

<script>

const chartCol = c => isLight(c) ? '#64748b' : c;           // couleur des graphiques (blanc -> gris)

const ic = (n, cls='') => `<svg class="i ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const FONT = '-apple-system,Helvetica,Arial,sans-serif';
const uid = () => Math.random().toString(36).slice(2,9);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f3 = n => (+n).toFixed(3);

/* ---------------- Dessin des terrains (unités : mètres) ---------------- */
function W_(s, inner){ return `<g stroke="#fff" stroke-width="${s.sw}" fill="none" stroke-linejoin="round">${inner}</g>`; }
function halfRot(L, W, inner){ return `<g>${inner}</g><g transform="translate(${L},${W}) rotate(180)">${inner}</g>`; }

const SPORTS = {
  badminton:{
    name:'Badminton', icon:'badminton', kind:'indiv', L:13.4, W:6.1, m:1.2, sw:0.045,
    floor:'#3f8a63', out:'#2c6447', depth:['avant (filet)','milieu','fond'],
    sub:'terrain 13,40 × 6,10 m',
    items:[
      {name:'Point', outcome:true, auto:true, ok:'Gagnant', ko:'Faute', color:'#16a34a'},

      <line x1="0.76" y1="0" x2="0.76" y2="${W}"/><line x1="12.64" y1="0" x2="12.64" y2="${W}"/>
      <line x1="4.72" y1="0" x2="4.72" y2="${W}"/><line x1="8.68" y1="0" x2="8.68" y2="${W}"/>
      <line x1="0" y1="3.05" x2="4.72" y2="3.05"/><line x1="8.68" y1="3.05" x2="${L}" y2="3.05"/>`)
      + `<line x1="6.7" y1="-0.4" x2="6.7" y2="6.5" stroke="#111827" stroke-width="0.1"/>
         <circle cx="6.7" cy="-0.4" r="0.1" fill="#111827"/><circle cx="6.7" cy="6.5" r="0.1" fill="#111827"/>`; }
  },
  basket:{
    name:'Basket-ball', icon:'basket', kind:'team', poss:true, colors:{A:'#ffffff', B:'#111827'}, L:28, W:15, m:1.6, sw:0.07,
    floor:'#d9b07a', out:'#a97c4a', depth:['loin','mi-distance','près du panier'],
    sub:'terrain entier 28 × 15 m',
    items:[
      {name:'Tir', outcome:true, auto:true, ok:'Marqué', ko:'Raté', color:'#16a34a'},
      {name:'Balle perdue', loss:true, outcome:false, auto:false, color:'#7c3aed'}
    ],
    draw(s){ const L=28,W=15; const half=`
      <rect x="0" y="5.05" width="5.8" height="4.9" fill="rgba(120,40,10,.22)"/>
      <circle cx="5.8" cy="7.5" r="1.8"/>
      <path d="M0 0.9 L2.99 0.9 A6.75 6.75 0 0 1 2.99 14.1 L0 14.1"/>
      <line x1="1.2" y1="6.6" x2="1.2" y2="8.4" stroke-width="${s.sw*1.6}"/>
      <path d="M1.2 6.25 L1.575 6.25 A1.25 1.25 0 0 1 1.575 8.75 L1.2 8.75"/>
      <circle cx="1.575" cy="7.5" r="0.23" stroke="#ea580c" stroke-width="${s.sw*1.3}"/>`;
      return W_(s, `<rect x="0" y="0" width="${L}" height="${W}"/><line x1="14" y1="0" x2="14" y2="${W}"/>
        <circle cx="14" cy="7.5" r="1.8"/>` + halfRot(L,W,half)); }
  },
  volley:{
    name:'Volley-ball', icon:'volley', kind:'team', L:18, W:9, m:2.4, sw:0.06,
    floor:'#d98a4a', out:'#3f7a5c', depth:['avant (zone d’attaque)','milieu','fond'],
    sub:'terrain 18 × 9 m + zone libre',
    items:[
      {name:'Attaque / renvoi', outcome:true, auto:true, ok:'Point', ko:'Faute', color:'#16a34a'},
      {name:'Service', outcome:true, auto:true, ok:'Réussi', ko:'Faute', color:'#0891b2'}
    ],

      <rect x="0" y="0" width="${L}" height="${W}"/>
      <line x1="6" y1="0" x2="6" y2="${W}"/><line x1="12" y1="0" x2="12" y2="${W}"/>
      <line x1="6" y1="-0.6" x2="6" y2="0" stroke-dasharray="0.15 0.15"/><line x1="12" y1="-0.6" x2="12" y2="0" stroke-dasharray="0.15 0.15"/>
      <line x1="6" y1="${W}" x2="6" y2="${W+0.6}" stroke-dasharray="0.15 0.15"/><line x1="12" y1="${W}" x2="12" y2="${W+0.6}" stroke-dasharray="0.15 0.15"/>`)
      + `<line x1="9" y1="-0.6" x2="9" y2="9.6" stroke="#111827" stroke-width="0.13"/>
         <circle cx="9" cy="-0.6" r="0.13" fill="#111827"/><circle cx="9" cy="9.6" r="0.13" fill="#111827"/>`; }
  },
  futsal:{
    name:'Futsal', icon:'futsal', kind:'team', poss:true, L:40, W:20, m:2, sw:0.09,

    items:[
      {name:'Tir', outcome:true, auto:true, ok:'But', ko:'Raté', color:'#16a34a'},

      <path d="M0 2.5 A6 6 0 0 1 6 8.5 L6 11.5 A6 6 0 0 1 0 17.5"/>

      <rect x="-0.9" y="8.5" width="0.9" height="3" fill="rgba(255,255,255,.3)"/>`;
      return W_(s, `<rect x="0" y="0" width="${L}" height="${W}"/><line x1="20" y1="0" x2="20" y2="${W}"/>
        <circle cx="20" cy="10" r="3"/><circle cx="20" cy="10" r="0.13" fill="#fff"/>` + halfRot(L,W,half)); }
  },
  ultimate:{

    sub:'terrain de hand, zone des 6 m = zone de but',
    items:[
      {name:'Passe vers la zone', outcome:true, auto:true, ok:'But', ko:'Ratée', color:'#16a34a'},

      return W_(s, `<rect x="0" y="0" width="${L}" height="${W}"/><line x1="20" y1="0" x2="20" y2="${W}"/>
        <circle cx="20" cy="10" r="0.13" fill="#fff"/>` + halfRot(L,W,half)); }

/* ---------------- État ---------------- */
let S = load();
let draft = null;
let pending = null;
let capBlob = null, capURL = null;

function defaultState(key, mode){
  const sp = SPORTS[key], ind = sp.kind === 'indiv';
  const items = sp.items.map(i => ({ok:'Réussi', ko:'Raté', ...i, id:uid()}));
  const st = {
    sport:key, names:{A: ind?'Joueur 1':'Équipe A', B: ind?'Joueur 2':'Équipe B'},
    players:{A:[],B:[]}, playersMode:false, items, colors:{...(sp.colors || DEF_COL)}, points:[], swapped:false, period:1,
    mode: mode || 'prof', autoTeam:true, sel:{item:items[0].id, team:'A'},
    view:{team:'all', item:'all', res:'all', player:'all', period:'all', points:true, heat:false, zones:false, colorBy:'team'},
    started: Date.now()
  };
  return migrate(st);
}
function migrate(s){
  s.poss = s.poss || []; if(s.cur === undefined) s.cur = null; s.possTeam = s.possTeam || 'A';
  if(!s.obsMode) s.obsMode = s.sport === 'basket' ? 'poss' : 'actions';
  if(s.view.trails === undefined) s.view.trails = true;
  if(s.view.lanes === undefined) s.view.lanes = true;
  s.dribble = false; return s;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && SPORTS[s.sport]) return migrate(s); }catch(e){} return null; }
const clone = o => JSON.parse(JSON.stringify(o));
const sp = () => SPORTS[S.sport];
const itemById = id => S.items.find(i => i.id === id);
const word = () => sp().kind === 'indiv' ? 'Joueur' : 'Équipe';
// conversion repère canonique (A joue vers la droite) <-> affichage (rotation 180° après changement de côté)
function flip(x, y){ const s = sp(); return S.swapped ? [s.L - x, s.W - y] : [x, y]; }

/* ---------------- Possessions : occupation de l'espace ---------------- */
// 1 tap = une croix là où va le ballon (passe ou dribble, peu importe) · double-tap = tir · bouton Perte
const hasPoss = () => !!sp().poss;
const isPoss = () => hasPoss() && S.obsMode === 'poss';
const lossItem = () => S.items.find(i => i.loss) || S.items.find(i => /perd|perte/i.test(i.name));
const shotItem = () => S.items.find(i => i.outcome && i.auto) || S.items.find(i => i.outcome);
const other = t => t === 'A' ? 'B' : 'A';
const dec = x => x.toFixed(1).replace('.', ',');
const plural = (n, w) => `${n} ${w}${n > 1 ? 's' : ''}`;
let lastTap = null;
function laneOf(y, team){ const W = sp().W, r = y < W/3 ? 0 : y < 2*W/3 ? 1 : 2; return team === 'A' ? r : 2 - r; }  // 0 gauche, 1 axe, 2 droite (vu de l'attaquant)
const attHalf = t => t === 'A' ? 'R' : 'L';
function attPts(p){ const h = attHalf(p.team); return p.pts.filter(q => { const z = zoneOf(q); return z && z.half === h; }); }
function nSect(p){ return new Set(attPts(p).map(q => { const z = zoneOf(q); return z.ci + ',' + z.ri; })).size; }
function hullArea(pts){
  const P = pts.map(q => [q.x, q.y]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if(P.length < 3) return 0;
  const cr = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = [], up = [];
  for(const p of P){ while(lo.length >= 2 && cr(lo[lo.length-2], lo[lo.length-1], p) <= 0) lo.pop(); lo.push(p); }
  for(const p of P.slice().reverse()){ while(up.length >= 2 && cr(up[up.length-2], up[up.length-1], p) <= 0) up.pop(); up.push(p); }
  const h = lo.slice(0, -1).concat(up.slice(0, -1));
  let a = 0; for(let i = 0; i < h.length; i++){ const [x1, y1] = h[i], [x2, y2] = h[(i+1) % h.length]; a += x1*y2 - x2*y1; }
  return Math.abs(a) / 2;
}
function possFiltered(){
  const v = S.view;
  return S.poss.filter(p => S.mode === 'eleve' || ((v.team==='all' || p.team===v.team) && (v.period==='all' || p.period===+v.period)));
}
function possStats(list, t){
  const s = sp(), ps = list.filter(p => p.team === t && p.end), n = ps.length;
  const lanes = [0,0,0]; let nl = 0, wide = 0, sec = 0, surf = 0;
  ps.forEach(p => { const seen = new Set(), ap = attPts(p);
    ap.forEach(q => { const l = laneOf(q.y, t); lanes[l]++; nl++; seen.add(l); });
    if(seen.has(0) && seen.has(2)) wide++;
    sec += nSect(p); surf += hullArea(ap); });
  const bk = ['0–1','2','3','4','5+'].map(lab => ({lab, n:0, ok:0, ko:0, perte:0}));
  ps.forEach(p => { const b = bk[Math.min(4, Math.max(0, nSect(p) - 1))]; b.n++; b[p.end]++; });
  const halfA = s.L/2 * s.W;
  return {n, ok: ps.filter(p => p.end==='ok').length, ko: ps.filter(p => p.end==='ko').length,
    perte: ps.filter(p => p.end==='perte').length, lanes: lanes.map(v => nl ? Math.round(v/nl*100) : 0), nl,
    wide: n ? Math.round(wide/n*100) : 0, sec: n ? sec/n : 0, surf: n ? surf/n : 0, surfPct: n ? Math.round(surf/n/halfA*100) : 0, bk};
}
const markerDef = () => '';
function lanesSVG(sw){
  const s = sp(), a = s.W/3;
  return `<rect x="0" y="${f3(a)}" width="${s.L}" height="${f3(a)}" fill="#facc15" fill-opacity=".14"/>
    <g stroke="#fff" stroke-opacity=".65" stroke-width="${f3(sw)}" stroke-dasharray="${f3(sw*4)} ${f3(sw*3)}">
    <line x1="0" y1="${f3(a)}" x2="${s.L}" y2="${f3(a)}"/><line x1="0" y1="${f3(2*a)}" x2="${s.L}" y2="${f3(2*a)}"/></g>`;
}
function crossMark(x, y, c, r){
  const k = r*0.8, d = `M${f3(x-k)} ${f3(y-k)}L${f3(x+k)} ${f3(y+k)}M${f3(x+k)} ${f3(y-k)}L${f3(x-k)} ${f3(y+k)}`;
  return `<g stroke-linecap="round" fill="none"><path d="${d}" stroke="${halo(c)}" stroke-width="${f3(r*0.8)}"/><path d="${d}" stroke="${c}" stroke-width="${f3(r*(isLight(c) ? 0.5 : 0.4))}"/></g>`;
}
function endMark(x, y, res, c, r){
  const hc = halo(c);
  if(res === 'ok') return `<circle cx="${f3(x)}" cy="${f3(y)}" r="${f3(r*1.3)}" fill="${c}" stroke="${hc}" stroke-width="${f3(r*0.4)}"/>`;
  if(res === 'ko') return `<circle cx="${f3(x)}" cy="${f3(y)}" r="${f3(r*1.15)}" fill="none" stroke="${hc}" stroke-width="${f3(r*0.75)}"/><circle cx="${f3(x)}" cy="${f3(y)}" r="${f3(r*1.15)}" fill="none" stroke="${c}" stroke-width="${f3(r*0.42)}"/>`;
  if(res === 'perte'){ const k = r*1.45; return `<polygon points="${f3(x)},${f3(y-k)} ${f3(x+k)},${f3(y)} ${f3(x)},${f3(y+k)} ${f3(x-k)},${f3(y)}" fill="${c}" stroke="${hc}" stroke-width="${f3(r*0.35)}" stroke-linejoin="round"/>`; }
  return '';
}
// o = {P: conversion -> affichage, r, sw, op, live}
function trailSVG(p, o){
  const c = tc(p.team), hc = halo(c), pts = p.pts.map(q => o.P(q.x, q.y)), r = o.r, sw = o.sw;
  let g = `<g opacity="${o.op}">`;
  if(pts.length > 1){ const d = 'M' + pts.map(([x, y]) => f3(x) + ' ' + f3(y)).join('L');
    g += `<path d="${d}" fill="none" stroke="${hc}" stroke-opacity=".55" stroke-width="${f3(sw*1.9)}" stroke-linejoin="round" stroke-linecap="round"/>`
       + `<path d="${d}" fill="none" stroke="${c}" stroke-width="${f3(sw)}" stroke-linejoin="round" stroke-linecap="round"/>`; }
  pts.forEach(([x, y], i) => {
    const last = i === pts.length - 1;
    if(last && p.end){ g += endMark(x, y, p.end, c, r); return; }
    if(last && o.live) g += `<circle cx="${f3(x)}" cy="${f3(y)}" r="${f3(r*1.5)}" fill="#fff" fill-opacity=".35"/>`;
    g += crossMark(x, y, c, r);
  });
  return g + `</g>`;
}

function endPoss(res){
  const c = S.cur;
  if(!c || !c.pts.length){ toast('Touche d’abord le terrain'); return; }
  const last = c.pts[c.pts.length - 1], it = res === 'perte' ? lossItem() : shotItem();
  let pid = null;
  if(it){ pid = uid(); S.points.push({id:pid, x:last.x, y:last.y, team:c.team, item:it.id, res: res === 'perte' ? null : res, player:null, period:c.period, t:Date.now(), poss:c.id}); }
  const done = {...c, end:res, pid};
  S.poss.push(done);
  S.cur = null; S.possTeam = other(c.team); lastTap = null;
  save(); renderAll();
  const si = shotItem(), lab = res === 'ok' ? (si ? si.ok : 'Marqué') : res === 'ko' ? (si ? si.ko : 'Raté') : 'Perte';
  toast(`${lab} · ${plural(nSect(done), 'secteur')} utilisé${nSect(done) > 1 ? 's' : ''} — ballon à ${S.names[S.possTeam]}`);
}

function ptColor(p){ return (S.mode==='prof' && S.view.colorBy==='item') ? itemById(p.item).color : tc(p.team); }

function renderCourt(){
  const s = sp(), svg = $('#court'), m = s.m;
  svg.setAttribute('viewBox', `${-m} ${-m} ${s.L+2*m} ${s.W+2*m}`);
  const fs = Math.min(m*0.55, s.L*0.03);
  const left = S.swapped ? 'B' : 'A', right = S.swapped ? 'A' : 'B';
  let h = `<defs><filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${f3(s.L*0.02)}"/></filter></defs>
    <rect x="${-m}" y="${-m}" width="${s.L+2*m}" height="${s.W+2*m}" fill="${s.out}"/>
    <rect x="0" y="0" width="${s.L}" height="${s.W}" fill="${s.floor}"/>` + s.draw(s);
  const lab = (x, txt, t) => `<text x="${x}" y="${f3(-m/2)}" text-anchor="middle" dominant-baseline="middle" font-family="${FONT}" font-weight="700" font-size="${f3(fs)}" fill="${tc(t)}" stroke="${halo(tc(t))}" stroke-width="${f3(fs*0.22)}" paint-order="stroke">${esc(txt)}</text>`;
  h += lab(s.L/4, `${S.names[left]}  ▶`, left) + lab(3*s.L/4, `◀  ${S.names[right]}`, right);

function pointsLayer(pts){
  const s = sp(), r = s.L*0.012;
  return `<g>` + pts.map(p => {
    const [x, y] = flip(p.x, p.y), c = ptColor(p);
    if(p.res === 'ok') return `<circle cx="${f3(x)}" cy="${f3(y)}" r="${f3(r)}" fill="${c}" stroke="${halo(c)}" stroke-width="${f3(r*0.35)}"/>`;
    if(p.res === 'ko'){ const k = r*0.85, d = `M${f3(x-k)} ${f3(y-k)}L${f3(x+k)} ${f3(y+k)}M${f3(x+k)} ${f3(y-k)}L${f3(x-k)} ${f3(y+k)}`;
      return `<g stroke-linecap="round" fill="none"><path d="${d}" stroke="${halo(c)}" stroke-width="${f3(r*0.9)}"/><path d="${d}" stroke="${c}" stroke-width="${f3(r*(isLight(c) ? 0.66 : 0.48))}"/></g>`; }
    return `<polygon points="${f3(x)},${f3(y-r*1.15)} ${f3(x+r)},${f3(y+r*0.75)} ${f3(x-r)},${f3(y+r*0.75)}" fill="${c}" stroke="${halo(c)}" stroke-width="${f3(r*0.3)}" stroke-linejoin="round"/>`;
  }).join('') + `</g>`;
}
function heatLayer(pts){
  const s = sp(), r = s.L*0.04;
  return `<g filter="url(#blur)">` + pts.map(p => { const [x,y] = flip(p.x,p.y);
    return `<circle cx="${f3(x)}" cy="${f3(y)}" r="${f3(r)}" fill="${ptColor(p)}" fill-opacity="0.42"/>`; }).join('') + `</g>`;
}
function zoneOf(p){
  const s = sp(); if(p.x < 0 || p.x > s.L || p.y < 0 || p.y > s.W) return null;
  const half = p.x >= s.L/2 ? 'R' : 'L', x0 = half==='R' ? s.L/2 : 0;
  return {half, ci: Math.min(2, Math.floor((p.x - x0)/(s.L/6))), ri: Math.min(2, Math.floor(p.y/(s.W/3)))};
}
function zonesLayer(pts){
  const s = sp(), cw = s.L/6, ch = s.W/3, fsz = Math.min(cw, ch)*0.19;
  let h = `<g font-family="${FONT}" text-anchor="middle" dominant-baseline="middle">`;
  for(const half of ['L','R']){
    const x0 = half==='R' ? s.L/2 : 0, cnt = Array(9).fill(0); let tot = 0;
    pts.forEach(p => { const z = zoneOf(p); if(z && z.half===half){ cnt[z.ri*3+z.ci]++; tot++; } });
    const mx = Math.max(1, ...cnt);
    for(let ri=0; ri<3; ri++) for(let ci=0; ci<3; ci++){
      const n = cnt[ri*3+ci]; let x = x0 + ci*cw, y = ri*ch;
      if(S.swapped){ x = s.L - x - cw; y = s.W - y - ch; }
      const pct = tot ? Math.round(n/tot*100) : 0;
      h += `<rect x="${f3(x)}" y="${f3(y)}" width="${f3(cw)}" height="${f3(ch)}" fill="#facc15" fill-opacity="${tot ? (0.06 + 0.55*n/mx).toFixed(2) : 0}" stroke="#fde047" stroke-width="${f3(s.sw*0.8)}" stroke-dasharray="${f3(s.sw*3)} ${f3(s.sw*3)}"/>`;
      if(tot) h += `<text x="${f3(x+cw/2)}" y="${f3(y+ch/2)}" font-size="${f3(fsz)}" font-weight="800" fill="#111827" stroke="#fff" stroke-width="${f3(fsz*0.16)}" paint-order="stroke">${pct}%</text>
        <text x="${f3(x+cw/2)}" y="${f3(y+ch/2+fsz*0.85)}" font-size="${f3(fsz*0.5)}" fill="#111827" stroke="#fff" stroke-width="${f3(fsz*0.1)}" paint-order="stroke">(${n})</text>`;
    }
  }
  return h + `</g>`;
}

/* ---------------- Statistiques ---------------- */
function zoneName(team, z){
  const s = sp(); const d = z.half==='R' ? z.ci : 2 - z.ci;
  const lat = team==='A' ? ['gauche','centre','droite'][z.ri] : ['droite','centre','gauche'][z.ri];
  return `${s.depth[d]} · ${lat}`;
}
function teamStats(pts, team){
  const tp = pts.filter(p => p.team === team);
  const items = S.items.map(it => { const a = tp.filter(p => p.item === it.id);
    return {it, n:a.length, ok:a.filter(p=>p.res==='ok').length, ko:a.filter(p=>p.res==='ko').length}; }).filter(x => x.n);
  const tgt = team==='A' ? 'R' : 'L', cnt = {}; let tot = 0;
  tp.forEach(p => { const z = zoneOf(p); if(z && z.half===tgt){ tot++; const k = z.ci+','+z.ri; cnt[k] = (cnt[k]||0)+1; } });
  let zone = null;
  if(tot >= 3){ let best = null; for(const k in cnt) if(!best || cnt[k] > cnt[best]) best = k;
    const [ci, ri] = best.split(',').map(Number);
    zone = {name: zoneName(team, {half:tgt, ci, ri}), pct: Math.round(cnt[best]/tot*100), n: tot}; }
  let players = null;
  if(S.playersMode && sp().kind==='team'){ players = {};
    tp.forEach(p => { if(!p.player) return; const o = players[p.player] = players[p.player] || {n:0,ok:0};
      o.n++; if(p.res==='ok') o.ok++; }); }
  return {n: tp.length, items, zone, players, out: tp.filter(p => !zoneOf(p)).length};
}
const pc = (a, b) => b ? Math.round(a/b*100) + ' %' : '–';
function itemLine(x){
  return x.it.outcome ? `${esc(x.it.name)} : <b>${x.n}</b> — ✓ ${x.ok} / ✗ ${x.ko} (${pc(x.ok, x.ok+x.ko)})` : `${esc(x.it.name)} : <b>${x.n}</b>`;
}

$('#court').addEventListener('click', e => {

  const svg = $('#court'), pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse()), s = sp();
  if(p.x < -s.m || p.x > s.L + s.m || p.y < -s.m || p.y > s.W + s.m) return;
  const [cx, cy] = flip(p.x, p.y);
  if(isPoss()){
    const now = Date.now();
    if(lastTap && now - lastTap.t < 400 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 55 && S.cur && S.cur.pts.length){ lastTap = null; openShot(e); return; }
    lastTap = {t:now, x:e.clientX, y:e.clientY}; addPass(cx, cy); return; }
  const it = itemById(S.sel.item);
  if(!it){ toast('Choisis d’abord une action'); return; }
  const team = (it.auto && S.autoTeam) ? (cx >= s.L/2 ? 'A' : 'B') : S.sel.team;
  const point = {id:uid(), x:+cx.toFixed(2), y:+cy.toFixed(2), team, item:it.id, res:null, player:null, period:S.period, t:Date.now()};
  const usePlayers = S.mode==='prof' && S.playersMode && s.kind==='team' && S.players[team].length;
  if(it.outcome || usePlayers) openPopup(e, point); else addPoint(point);
});

/* ---------------- Capture d'écran ---------------- */
function filterDesc(){
  if(isPoss()){ const v = S.view, parts = ['Occupation de l’espace'];
    if(S.mode === 'prof' && v.team !== 'all') parts.push(word() + ' : ' + S.names[v.team]);
    if(S.mode === 'prof' && v.period !== 'all') parts.push('Période ' + v.period);
    return parts.join(' · '); }
  if(S.mode === 'eleve') return 'Toutes les actions';
  const v = S.view, parts = [];
  parts.push(v.item==='all' ? 'Toutes les actions' : 'Action : ' + (itemById(v.item)||{}).name);
  if(v.team!=='all') parts.push(word() + ' : ' + S.names[v.team]);
  if(v.res!=='all') parts.push(v.res==='ok' ? 'Réussis' : 'Ratés');
  if(v.period!=='all') parts.push('Période ' + v.period);
  if(v.player!=='all') parts.push('Joueur : ' + v.player);
  return parts.join(' · ');
}
async function capture(){
  closePopup(); renderCourt();
  const s = sp(), svg = $('#court');
  const cl = svg.cloneNode(true); const pl = cl.querySelector('#pendingL'); if(pl) pl.remove();
  const W = 1800, H = Math.round(W*(s.W+2*s.m)/(s.L+2*s.m));
  cl.setAttribute('xmlns','http://www.w3.org/2000/svg'); cl.setAttribute('width', W); cl.setAttribute('height', H);
  cl.removeAttribute('id'); cl.removeAttribute('style');
  const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(cl));
  try{
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = src; });
    const pts = filtered(), lines = [], pl = isPoss() ? possFiltered() : null;
    ['A','B'].forEach(t => { if(S.mode==='prof' && S.view.team!=='all' && S.view.team!==t) return;
      if(pl){ const st = possStats(pl, t);
        lines.push({t, txt: `${S.names[t]} : ` + (st.n ? `${plural(st.n, 'attaque')}  ·  ${dec(st.sec)} secteurs / attaque  ·  surface ${Math.round(st.surf)} m²  ·  ${st.lanes[1]} % dans l’axe  ·  paniers ${pc(st.ok, st.n)}  ·  ${plural(st.perte, 'perte')}` : 'aucune attaque')});
        return; }
      const st = teamStats(pts, t);
      let txt = `${S.names[t]} : ` + (st.items.length ? st.items.map(x => x.it.outcome ? `${x.it.name} ${x.n} (✓ ${x.ok}, ✗ ${x.ko} = ${pc(x.ok, x.ok+x.ko)})` : `${x.it.name} ${x.n}`).join('  ·  ') : 'aucune action');
      if(st.zone) txt += `   |   zone la plus fréquente : ${st.zone.name} (${st.zone.pct} %)`;
      lines.push({t, txt}); });
    const head = 128, lh = 46, foot = 40 + lines.length*lh + 40;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = head + H + foot;
    const c = cv.getContext('2d');
    c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height);
    c.fillStyle = '#111827'; c.font = `bold 46px ${FONT}`;
    c.fillText(`${s.name} — ${S.names.A} vs ${S.names.B}`, 32, 60);
    c.fillStyle = '#4b5563'; c.font = `28px ${FONT}`;
    c.fillText(`${filterDesc()}  ·  ${new Date().toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}`, 32, 104);
    c.drawImage(img, 0, head, W, H);
    let y = head + H + 56;
    c.font = `28px ${FONT}`;
    lines.forEach(l => { c.fillStyle = tc(l.t); c.fillRect(32, y-22, 26, 26); c.strokeStyle = '#9ca3af'; c.lineWidth = 2; c.strokeRect(32, y-22, 26, 26); c.fillStyle = '#111827';
      c.fillText(l.txt, 72, y, W - 100); y += lh; });
    c.fillStyle = '#6b7280'; c.font = `24px ${FONT}`; c.fillText(isPoss() ? '✕ position du ballon    ● panier    ○ raté    ◆ perte' : '● réussi    ✕ raté    ▲ action sans résultat', 32, y + 6);
    cv.toBlob(b => showCap(b ? URL.createObjectURL(b) : cv.toDataURL('image/png'), b), 'image/png');
  }catch(err){
    showCap(src, null);
  }

}
function keyZone(t, pts, half){
  const s = sp(), {cells, tot} = cellCounts(t, pts, half);
  if(tot < 2) return null;
  const c = cells.reduce((a, b) => b.n > a.n ? b : a);
  const tgt = t==='A' ? 'R' : 'L', h = c.x >= s.L/2 - 1e-6 ? 'R' : 'L', ci = Math.round((c.x - (h==='R' ? s.L/2 : 0)) / (s.L/6));
  const lat = t==='A' ? ['gauche','centre','droite'][c.ri] : ['droite','centre','gauche'][c.ri];
  return {name: h === tgt ? zoneName(t, {half:h, ci, ri:c.ri}) : `dans son camp · ${lat}`, pct: Math.round(c.n/tot*100)};
}
function miniCourt(t, pts, half, X, Y, w, h){
  const s = sp(), m = s.m, L = s.L, Wd = s.W;
  let mat, P, vb;
  if(half){
    mat = t==='A' ? `matrix(0 -1 1 0 0 ${L})` : `matrix(0 1 -1 0 ${Wd} 0)`;
    P = t==='A' ? (x, y) => [y, L - x] : (x, y) => [Wd - y, x];
    vb = [-m, -m, Wd + 2*m, L/2 + m];
  } else { mat = ''; P = (x, y) => [x, y]; vb = [-m, -m, L + 2*m, Wd + 2*m]; }
  const k = vb[2] / w;                       // unités terrain par pixel
  let g = `<svg x="${f3(X)}" y="${f3(Y)}" width="${f3(w)}" height="${f3(h)}" viewBox="${vb.map(f3).join(' ')}" overflow="hidden">
    <rect x="${f3(vb[0])}" y="${f3(vb[1])}" width="${f3(vb[2])}" height="${f3(vb[3])}" fill="${s.out}"/>
    <g ${mat ? `transform="${mat}"` : ''}><rect x="0" y="0" width="${L}" height="${Wd}" fill="${s.floor}"/>${s.draw(s)}</g>`;
  const {cells, tot, mx} = cellCounts(t, pts, half);
  const labels = [];
  cells.forEach(c => {
    const [u1, v1] = P(c.x, c.y), [u2, v2] = P(c.x + c.w, c.y + c.h);
    const u = Math.min(u1, u2), v = Math.min(v1, v2), cw = Math.abs(u2 - u1), chh = Math.abs(v2 - v1);
    g += `<rect x="${f3(u)}" y="${f3(v)}" width="${f3(cw)}" height="${f3(chh)}" fill="#f97316" fill-opacity="${tot && c.n ? (0.12 + 0.6*c.n/mx).toFixed(2) : 0}" stroke="#fff" stroke-opacity=".7" stroke-width="${f3(k*1.5)}" stroke-dasharray="${f3(k*6)} ${f3(k*5)}"/>`;
    if(c.n){ const fs = k*26;
      labels.push(`<text x="${f3(u + cw/2)}" y="${f3(v + chh/2 + fs*0.35)}" font-size="${f3(fs)}" text-anchor="middle" font-weight="800" fill="#111827" stroke="#fff" stroke-width="${f3(fs*0.18)}" paint-order="stroke">${Math.round(c.n/tot*100)}%</text>`); }
  });
  const r = k*9;
  pts.forEach(p => { const [x, y] = P(p.x, p.y), c = tc(p.team);
    if(p.res==='ok') g += `<circle cx="${f3(x)}" cy="${f3(y)}" r="${f3(r)}" fill="${c}" stroke="${halo(c)}" stroke-width="${f3(r*0.35)}"/>`;
    else if(p.res==='ko'){ const q = r*0.85, d = `M${f3(x-q)} ${f3(y-q)}L${f3(x+q)} ${f3(y+q)}M${f3(x+q)} ${f3(y-q)}L${f3(x-q)} ${f3(y+q)}`;
      g += `<g stroke-linecap="round" fill="none"><path d="${d}" stroke="${halo(c)}" stroke-width="${f3(r*0.9)}"/><path d="${d}" stroke="${c}" stroke-width="${f3(r*(isLight(c) ? 0.66 : 0.48))}"/></g>`; }
    else g += `<polygon points="${f3(x)},${f3(y-r*1.15)} ${f3(x+r)},${f3(y+r*0.75)} ${f3(x-r)},${f3(y+r*0.75)}" fill="${c}" stroke="${halo(c)}" stroke-width="${f3(r*0.3)}"/>`;
  });
  return g + labels.join('') + `</svg>`;
}

/* ---------------- Actions des boutons ---------------- */
const ACT = {
  // réglages
  resume(){ draft = null; showObs(); },
  pickSport(b, v){ if(draft && draft.sport === v) return; draft = defaultState(v, draft ? draft.mode : 'prof'); renderSetup(); },
  dTog(b){ draft[b.dataset.k] = !draft[b.dataset.k]; renderSetup(); },
  dColor(b, v){ draft.colors[b.dataset.t] = v; renderSetup(); },
  dMode(b, v){ draft.mode = v; renderSetup(); },
  itTog(b){ const it = draft.items.find(i => i.id === b.dataset.id); it[b.dataset.k] = !it[b.dataset.k]; renderSetup(); },
  delItem(b){ if(draft.items.length <= 1){ toast('Il faut au moins une action'); return; } draft.items = draft.items.filter(i => i.id !== b.dataset.id); renderSetup(); },
  addItem(){ const cols = ['#ea580c','#0891b2','#db2777','#65a30d','#ca8a04','#4f46e5'];
    draft.items.push({id:uid(), name:'', outcome:false, auto:false, ok:'Réussi', ko:'Raté', color:cols[draft.items.length % cols.length]}); renderSetup();
    const ins = document.querySelectorAll('.itrow .nm'); if(ins.length) ins[ins.length-1].focus(); },
  start(){
    draft.items = draft.items.filter(i => i.name.trim());
    if(!draft.items.length){ toast('Donne un nom à au moins une action'); return; }
    if(S && (S.points.length || S.poss.length) && !draft.points.length && !draft.poss.length && !confirm('Le match en cours sera effacé. Continuer ?')) return;
    if(!draft.items.find(i => i.id === draft.sel.item)) draft.sel.item = draft.items[0].id;
    if(draft.view.item !== 'all' && !draft.items.find(i => i.id === draft.view.item)) draft.view.item = 'all';
    if(!draft.playersMode) draft.view.player = 'all';
    S = draft; draft = null; save(); showObs();
  },
  // saisie
  selItem(b, v){ S.sel.item = v; save(); renderPanel(); renderTop(); },
  selTeam(b, v){ S.sel.team = v; save(); renderPanel(); renderTop(); },
  togglePanel(){ S.panelHidden = !S.panelHidden; save(); renderTop(); renderCourt(); },
  autoTeam(){ S.autoTeam = !S.autoTeam; save(); renderPanel(); renderTop(); },
  undo(){ if(isPoss()) return undoPoss(); if(!S.points.length){ toast('Rien à annuler'); return; } S.points.pop(); save(); renderAll(); toast('Dernière action supprimée'); },
  del(b, v){ S.points = S.points.filter(p => p.id !== v); save(); renderAll(); },
  swap(){ S.swapped = !S.swapped; save(); renderAll(); toast('Côtés inversés'); },
  period(){ S.period++; save(); renderAll(); toast('Période ' + S.period); },
  // possessions
  obsMode(b, v){ S.obsMode = v; if(v === 'poss') S.view.player = 'all'; save(); renderAll(); },
  possTeam(b, v){ S.possTeam = v; if(S.cur) S.cur.team = v; save(); renderAll(); },
  pTeamToggle(){ const t = other(S.cur ? S.cur.team : S.possTeam); ACT.possTeam(null, t); },
    pEnd(b, v){ closePopup(); endPoss(v); },
  delPoss(b, v){ const p = S.poss.find(q => q.id === v); if(!p) return; S.poss = S.poss.filter(q => q.id !== v); S.points = S.points.filter(q => q.id !== p.pid); save(); renderAll(); },
  pLoss(){ const li = lossItem(); if(!li || !pending) return; pending.item = li.id; pending.res = null; const p = pending; closePopup(); addPoint(p); },
  // affichage
  vTog(b){ const k = b.dataset.k; S.view[k] = !S.view[k]; save(); renderCourt(); renderPanel(); },
  filt(b, v){ S.view[b.dataset.k] = v; if(b.dataset.k === 'team') S.view.player = 'all'; save(); renderCourt(); renderPanel(); },
  // popup
  pSwap(){ pending.team = pending.team === 'A' ? 'B' : 'A'; if(pending.player && !S.players[pending.team].includes(pending.player)) pending.player = null; renderPopup(); renderPending(); },
  pPlayer(b, v){ const it = itemById(pending.item);
    if(it.outcome){ pending.player = pending.player === v ? null : v; renderPopup(); }
    else { pending.player = v; const p = pending; closePopup(); addPoint(p); } },
  pRes(b, v){ pending.res = v || null; const p = pending; closePopup(); addPoint(p); },
  pCancel(){ closePopup(); },
  // modes
  toEleve(){ S.mode = 'eleve'; save(); showObs(); },
  toProf(){ if(confirm('Passer en mode prof ?')){ S.mode = 'prof'; save(); showObs(); } },
  settings(){ draft = clone(S); draft.colors = draft.colors || {...DEF_COL}; showSetup(); },
  newMatch(){ if(!confirm('Effacer toutes les actions de ce match ?')) return; S.points = []; S.poss = []; S.cur = null; S.possTeam = 'A'; S.period = 1; S.swapped = false; S.started = Date.now(); S.view.period = 'all'; save(); renderAll(); },
  // fin du match
  endMatch(){ showEnd(); },
  endSel(b, v){ endSel[b.dataset.k] = v; renderEnd(); },
  endClose(){ $('#end').classList.add('hidden'); },
  endCap(){ const p = posterSVG(); svgToCap(p.svg, p.W, p.H); },
  // capture
  capture(){ capture(); },
  capClose(){ $('#cap').classList.add('hidden'); },
  async capShare(){ try{ await navigator.share({files:[new File([capBlob], `observation-${S.sport}.png`, {type:'image/png'})], title:"PlayZone"}); }catch(e){} }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const f = ACT[b.dataset.act]; if(f){ e.preventDefault(); f(b, b.dataset.v, e); }
});
// empêcher le zoom par pincement sur iPad
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------------- Démarrage ---------------- */
if(S) showObs(); else showSetup();
</script>
